name: Deploy registry + site

# Serves the registry JSON (public/r/*.json) AND the ui.jixoai.com showcase
# site (public/*.html) on GitHub Pages. The custom domain ui.jixoai.com is
# Owner-managed DNS on top of this deployment.
#
# Artifact order is load-bearing (mirrors scripts/build-site.mjs): the site
# dist is copied into a freshly emptied public/ BEFORE `shadcn build` emits
# public/r/, so /r/*.json and the site coexist on the root domain and the
# registry JSON paths never move.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root deps (shadcn)
        run: npm install --no-fund --no-audit
      - name: Install site deps (apps/www)
        run: npm install --no-fund --no-audit
        working-directory: apps/www
      # Ghostty wasm supply chain (ghostty-term design D2): pre-seed the
      # vite-plugin resolver cache — the repo-root cwd default cache spot
      # node_modules/.cache/jixoai-ghostty — from GitHub's cache service,
      # so the site build serves the pinned wasm without a fresh download.
      # The key hashes the pin manifest itself: a merged pin-update PR
      # rotates it, and the restore-keys prefix falls back to the newest
      # stale entry. Cache hits are still sha256-verified by the resolver;
      # a miss (first run, eviction, new pin) is NOT a failure — the
      # build-time resolver downloads over the hardened path (https only,
      # per-hop host allowlist, streaming 4MiB cap). Absolute zero-network
      # is explicitly not promised; airgap builds use
      # JIXOAI_GHOSTTY_WASM_PATH to point at a local file instead.
      - name: Restore pinned ghostty wasm cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/jixoai-ghostty
          key: ghostty-wasm-${{ hashFiles('packages/vite-plugin/ghostty.pin.json') }}
          restore-keys: |
            ghostty-wasm-
      - name: Build site + registry into public/
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
