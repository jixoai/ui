name: Deploy registry + site

# Serves the registry JSON (public/r/*.json) AND the ui.jixoai.com showcase
# site (public/*.html) on GitHub Pages. The custom domain ui.jixoai.com is
# Owner-managed DNS on top of this deployment.
#
# Artifact order is load-bearing (mirrors scripts/build-site.mjs): the site
# dist is copied into a freshly emptied public/ BEFORE `shadcn build` emits
# public/r/, so /r/*.json and the site coexist on the root domain and the
# registry JSON paths never move.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root deps (shadcn)
        run: npm install --no-fund --no-audit
      - name: Install site deps (apps/www)
        run: npm install --no-fund --no-audit
        working-directory: apps/www
      # apps/www depends on @jixoai/vite-plugin via file:../../packages/
      # vite-plugin and imports it in vite.config.ts, but the package's
      # dist/ is gitignored — a clean checkout has no build output, so the
      # site build fails before any page compiles. CI builds the plugin
      # in this explicit, auditable step (scripts/build-site.mjs carries
      # the same check as a local-dev fallback only).
      - name: Build @jixoai/vite-plugin
        run: npm ci && npm run build
        working-directory: packages/vite-plugin
      # verify:laws runs css-laws' own tsx from its node_modules — the
      # package was never installed in CI before (the composite gate that
      # needs it postdates the last successful deploy, and the vite-plugin
      # lock break hid this step behind an earlier failure)
      - name: Install css-laws deps (verify:laws runner)
        run: npm install --no-fund --no-audit
        working-directory: packages/css-laws
      # Tracked-wasm + pin-schema sentinel (ghostty-term design D2's
      # double guardrail, offline side): no network assertions, no cache
      # requirement — this gates the supply-chain SHAPE (valid pin
      # manifest, zero `git ls-files '*.wasm'`) before anything consumes
      # the pin.
      # merge-alignment A3: THE composite gate — dependency shape,
      # laws freshness, mirror, budgets, ghostty-pin offline, and the
      # real-consumer shadcn-add contract, before any build output
      # ships. Runs after payloads/dist exist (the build steps below
      # rebuild them anyway; this step is the auditable fail-point).
      - name: Composite gate (verify:all)
        run: node scripts/verify-all.mjs
      - name: Verify ghostty pin (offline sentinel)
        run: node scripts/verify-ghostty-pin.mjs --offline
      # Ghostty wasm supply chain (ghostty-term design D2): pre-seed the
      # vite-plugin resolver cache — apps/www/node_modules/.cache/
      # jixoai-ghostty, the resolver's default for the site build's cwd
      # (apps/www; vite runs there, and defaultCacheDir() is
      # <cwd>/node_modules/.cache/jixoai-ghostty) — from GitHub's cache
      # service, so the site build serves the pinned wasm without a fresh
      # download. The key hashes the pin manifest itself — the manifest
      # IS the canonical carrier of both variant sha256s, so hashing it
      # is hashing the cache identity: a merged pin-update PR rotates the
      # key, and the restore-keys prefix falls back to the newest stale
      # entry. Cache hits are still sha256-verified by the resolver; a
      # miss (first run, eviction, new pin) is NOT a failure — the
      # build-time resolver downloads over the hardened path (https only,
      # per-hop host allowlist, streaming 4MiB cap). Absolute zero-network
      # is explicitly not promised; airgap builds use
      # JIXOAI_GHOSTTY_WASM_PATH to point at a local file instead.
      - name: Restore pinned ghostty wasm cache
        uses: actions/cache@v4
        with:
          path: apps/www/node_modules/.cache/jixoai-ghostty
          key: ghostty-wasm-${{ hashFiles('packages/vite-plugin/ghostty.pin.json') }}
          restore-keys: |
            ghostty-wasm-
      - name: Build site + registry into public/
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Post-publish smoke (2026-08-30-registry-install-integrity task 3.2):
  # the registry's ONE product promise is that the advertised install
  # URLs resolve — ui.jixoai.com must serve the site, the registry index,
  # and a registry item. Any non-200 fails the run WITH THE REMEDIATION:
  # the Pages custom-domain binding lives in repo settings (+ Owner DNS),
  # which no artifact can set — a DNS-lag failure is expected to re-run
  # green after the domain is re-attached.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke https://ui.jixoai.com (/, /r/registry.json, /r/press-button.json)
        run: |
          fail=0
          for path in / /r/registry.json /r/press-button.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://ui.jixoai.com${path}") || code=000
            if [ "$code" != "200" ]; then
              echo "::error::https://ui.jixoai.com${path} returned ${code} (expected 200)"
              fail=1
            else
              echo "ok: https://ui.jixoai.com${path} -> 200"
            fi
          done
          if [ "$fail" != "0" ]; then
            cat <<'EOF'
          REMEDIATION — the deployed artifact does not serve ui.jixoai.com:
            1. GitHub Pages settings → re-attach the custom domain
               (gh api repos/jixoai/ui/pages -X PUT -f cname=ui.jixoai.com),
               or re-run this job once the artifact's CNAME takes effect.
            2. Owner DNS: ui.jixoai.com must CNAME to jixoai.github.io
               (DNS propagation can lag minutes to hours after (re-)binding).
            3. Then re-run: gh workflow run deploy.yml (or re-run the smoke job).
          EOF
            exit 1
          fi
