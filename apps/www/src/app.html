<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" />
    <script>
      (() => {
        // No-flash theme bootstrap + JS liveness flag (reveal styles key off
        // html.js so prerendered and no-JS output stays fully visible).
        const root = document.documentElement;
        root.classList.add("js");
        const isTheme = (value) => value === "light" || value === "dark" || value === "system";
        let theme = "system";
        try {
          const stored = window.localStorage.getItem("theme");
          if (isTheme(stored)) theme = stored;
        } catch {
          theme = "system";
        }
        const prefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.classList.toggle("dark", theme === "dark" || (theme === "system" && prefersDark));
        root.style.colorScheme = root.classList.contains("dark") ? "dark" : "light";
      })();
    </script>
    %sveltekit.head%
    <script type="module" blocking="render" async>
      // Route-typed MPA view transitions (view-transitions-toolkit pattern):
      // from-/to-<route> types let CSS vary the page animation per pair.
      const routeMap = { index: '/', components: '/components', tokens: '/tokens' };
      const match = (url) => {
        const p = new URL(url, location.origin).pathname.replace(/\.html$/, '').replace(/\/+$/, '') || '/';
        return Object.entries(routeMap).find(([, path]) => path === p)?.[0];
      };
      const types = (t) => document.documentElement.style.setProperty('view-transition-name', 'root') || t;
      // pageswap: outgoing document tags from-<route>
      addEventListener('pageswap', (e) => {
        const from = match(e.activation?.entry?.url ?? location.href);
        if (from && e.viewTransition) e.viewTransition.types.add('from-' + from);
      });
      // pagereveal: incoming document tags to-<route>
      addEventListener('pagereveal', (e) => {
        const to = match(location.href);
        if (to && e.viewTransition) e.viewTransition.types.add('to-' + to);
      });
    </script>
  </head>
  <!--
    data-sveltekit-reload: the site is a flat multi-page artifact (index.html,
    components.html, tokens.html); every internal link performs a full page
    load instead of client-route resolution.
  -->
  <body data-sveltekit-reload>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
